<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Курс валют</title>
<style>
:root{color-scheme:dark;--bg:#17191c;--panel:#202225;--panel2:#191b1e;--line:#373a40;--text:#f2f4f7;--muted:#9aa5b4;--blue:#a8c7ff;--accent:#74dfba}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Arial,sans-serif}.wrap{max-width:1060px;margin:0 auto;padding:24px 16px 42px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:22px}h1{font-size:25px;font-weight:400;margin:0 0 3px}h2{font-size:17px;margin:22px 0 12px}.subtitle,.muted,.source{color:var(--muted)}.controls{display:flex;align-items:center;gap:8px}select,button,input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:9px}select{padding:9px 11px}button{padding:9px 14px;cursor:pointer;background:var(--blue);color:#101317;border-color:var(--blue);font-weight:600}.status{margin:18px 0 0;color:var(--muted)}.pairs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.pair{min-height:154px;padding:18px;border:1px solid var(--line);border-radius:13px;background:var(--panel);cursor:pointer;transition:.16s ease;outline:none}.pair:hover,.pair:focus-visible,.pair.selected{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}.pair-top{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}.pair-code{color:var(--blue);font-weight:700}.pair-value{font-size:29px;line-height:1.18;margin:17px 0 5px;letter-spacing:-.4px}.pair-caption{color:var(--muted);font-size:12px}.pair-reverse{border-top:1px solid var(--line);margin-top:15px;padding-top:12px}.pair-reverse b{font-weight:400}.converter{margin-top:24px;padding:18px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}.converter h2{margin:0 0 14px}.converter-row{display:grid;grid-template-columns:minmax(0,1fr) 42px minmax(0,1fr);gap:10px;align-items:center}.field{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}.field-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}.field label{color:var(--muted);font-size:12px}.field select{padding:2px 22px 2px 0;border:0;background:transparent;color:var(--muted);font-size:12px;text-align:right}.field input{width:100%;padding:0;border:0;background:transparent;border-radius:0;font-size:24px;outline:none}.swap{padding:0;background:transparent;border:0;color:var(--blue);font-size:22px;font-weight:400}.crypto{margin-top:24px;overflow:hidden;border-radius:13px;background:var(--panel)}.crypto-head,.crypto-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;padding:12px 14px;align-items:center}.crypto-head{color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}.crypto-row{font-size:15px;border-bottom:1px solid var(--line)}.crypto-row:last-child{border-bottom:0}.crypto-row span:not(:first-child),.crypto-head span:not(:first-child){text-align:right}.ticker{color:var(--accent);font-weight:700;margin-left:6px}.source{font-size:12px;margin-top:16px}@media(max-width:760px){header{display:block}.controls{margin-top:16px;justify-content:space-between}.pairs{grid-template-columns:1fr 1fr}.converter-row{grid-template-columns:1fr}.swap{transform:rotate(90deg);justify-self:center}}@media(max-width:480px){.pairs{grid-template-columns:1fr}.wrap{padding:18px 12px 32px}.pair-value{font-size:26px}}
</style>
</head>
<body><main class="wrap">
<header><div><h1>Курс валют</h1><p class="subtitle">Сравнение валютных пар и криптовалют</p></div><div class="controls"><span>Обновлять:</span><select id="refreshSelect"><option value="30000">30 секунд</option><option value="60000" selected>1 минута</option><option value="300000">5 минут</option></select><button id="refreshButton" type="button">Обновить</button></div></header>
<p class="status" id="status">Загрузка котировок...</p><h2>Основные валютные пары</h2><section class="pairs" id="pairs"></section>
<section class="converter"><h2>Конвертер выбранной пары</h2><div class="converter-row"><div class="field"><div class="field-head"><label id="fromLabel" for="fromInput">Казахстанский тенге</label><select id="fromSelect"></select></div><input id="fromInput" type="number" min="0" step="any" value="1" inputmode="decimal"></div><button class="swap" id="swapButton" type="button" aria-label="Поменять валюты местами">↔</button><div class="field"><div class="field-head"><label id="toLabel" for="toInput">Российский рубль</label><select id="toSelect"></select></div><input id="toInput" type="number" min="0" step="any" value="0" inputmode="decimal"></div></div></section>
<h2>Криптовалюты</h2><section class="crypto"><div class="crypto-head"><span>АКТИВ</span><span>RUB</span><span>USD</span></div><div id="cryptoRows"></div></section><p class="source">Источники: Open Exchange Rates и CoinGecko. Данные обновляются напрямую из браузера.</p>
</main>
<script>
const currencies={RUB:{name:'Российский рубль'},USD:{name:'Доллар США'},EUR:{name:'Евро'},KZT:{name:'Казахстанский тенге'},CNY:{name:'Китайский юань'},JPY:{name:'Японская йена'},TRY:{name:'Турецкая лира'}};const pairCodes=['USD','EUR','KZT','CNY','JPY','TRY'];const cryptoInfo=[{id:'bitcoin',name:'Bitcoin',ticker:'BTC'},{id:'ethereum',name:'Ethereum',ticker:'ETH'},{id:'dogecoin',name:'Dogecoin',ticker:'DOGE'}];let fiatRates={RUB:1},cryptoRates={},fromCode='KZT',toCode='RUB',timer=null;const pairs=document.getElementById('pairs'),statusEl=document.getElementById('status'),fromInput=document.getElementById('fromInput'),toInput=document.getElementById('toInput'),fromSelect=document.getElementById('fromSelect'),toSelect=document.getElementById('toSelect');const format=(v,d=8)=>Number.isFinite(v)?new Intl.NumberFormat('ru-RU',{maximumFractionDigits:d}).format(v):'—';const rubPerUnit=code=>code==='RUB'?1:(fiatRates.RUB||0)/(fiatRates[code]||0);
function renderSelects(){const o=Object.keys(currencies).map(c=>'<option value="'+c+'">'+currencies[c].name+'</option>').join('');fromSelect.innerHTML=o;toSelect.innerHTML=o;fromSelect.value=fromCode;toSelect.value=toCode}
function renderPairs(){pairs.innerHTML=pairCodes.map(c=>{const r=rubPerUnit(c),inv=r?1/r:0;return '<article class="pair'+(c===fromCode?' selected':'')+'" data-code="'+c+'" tabindex="0" role="button" aria-label="Выбрать '+currencies[c].name+'"><div class="pair-top"><span>'+currencies[c].name+'</span><span class="pair-code">'+c+' / RUB</span></div><div class="pair-value">1 '+c+' = '+format(r)+' RUB</div><div class="pair-caption">стоимость одной единицы</div><div class="pair-reverse"><span>1 RUB = </span><b>'+format(inv)+' '+c+'</b></div></article>'}).join('');pairs.querySelectorAll('.pair').forEach(card=>{const choose=()=>{fromCode=card.dataset.code;toCode='RUB';fromInput.value='1';renderConverter()};card.addEventListener('click',choose);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}})})}
function renderConverter(){fromSelect.value=fromCode;toSelect.value=toCode;document.getElementById('fromLabel').textContent=currencies[fromCode].name;document.getElementById('toLabel').textContent=currencies[toCode].name;const a=Number(fromInput.value);const result=a*rubPerUnit(fromCode)/rubPerUnit(toCode);toInput.value=Number.isFinite(a)?result.toFixed(8).replace(/0+$/,'').replace(/\.$/,''):'';pairs.querySelectorAll('.pair').forEach(card=>card.classList.toggle('selected',card.dataset.code===fromCode))}
function recalculateFromTarget(){const a=Number(toInput.value),rate=rubPerUnit(fromCode)/rubPerUnit(toCode);fromInput.value=Number.isFinite(a)?(a/rate).toFixed(8).replace(/0+$/,'').replace(/\.$/,''):''}
function renderCrypto(){document.getElementById('cryptoRows').innerHTML=cryptoInfo.map(i=>{const d=cryptoRates[i.id]||{};return '<div class="crypto-row"><span>'+i.name+' <span class="ticker">'+i.ticker+'</span></span><span>'+format(d.rub,2)+'</span><span>'+format(d.usd,6)+'</span></div>'}).join('')}
async function loadRates(){statusEl.textContent='Загрузка котировок...';try{const[a,b]=await Promise.all([fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'}),fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,dogecoin&vs_currencies=rub,usd',{cache:'no-store'})]);const f=await a.json(),c=await b.json();if(f.result!=='success')throw Error('fiat');fiatRates=Object.assign({RUB:1},f.rates);cryptoRates=c;renderPairs();renderConverter();renderCrypto();statusEl.textContent='Обновлено: '+new Date().toLocaleString('ru-RU')}catch(e){statusEl.textContent='Не удалось обновить котировки. Проверьте подключение к интернету.';console.error(e)}}function restartTimer(){if(timer)clearInterval(timer);timer=setInterval(loadRates,Number(document.getElementById('refreshSelect').value))}
fromInput.addEventListener('input',renderConverter);toInput.addEventListener('input',recalculateFromTarget);fromSelect.addEventListener('change',()=>{fromCode=fromSelect.value;renderConverter()});toSelect.addEventListener('change',()=>{toCode=toSelect.value;renderConverter()});document.getElementById('swapButton').addEventListener('click',()=>{const old=fromCode;fromCode=toCode;toCode=old;fromInput.value='1';renderConverter()});document.getElementById('refreshButton').addEventListener('click',loadRates);document.getElementById('refreshSelect').addEventListener('change',restartTimer);renderSelects();renderPairs();renderConverter();renderCrypto();loadRates();restartTimer();
</script></body></html>
