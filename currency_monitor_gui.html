<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Курс валют</title>
  <style>
    :root{color-scheme:dark;--bg:#17191c;--panel:#202225;--panel2:#191b1e;--line:#373a40;--text:#f2f4f7;--muted:#9aa5b4;--blue:#a8c7ff;--accent:#74dfba}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Arial,sans-serif}
    .wrap{max-width:1060px;margin:0 auto;padding:24px 16px 42px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px}
    h1{font-size:25px;font-weight:400;margin:0 0 3px}h2{font-size:17px;margin:22px 0 12px}p{margin:0}.subtitle,.muted,.source{color:var(--muted)}
    .controls{display:flex;align-items:center;gap:8px;color:var(--muted);text-align:right}.last-update{white-space:nowrap}select,button,input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:9px}
    select{padding:9px 11px}button{padding:9px 14px;cursor:pointer;background:var(--blue);color:#101317;border-color:var(--blue);font-weight:600}button:hover{filter:brightness(1.08)}
    .status{margin:18px 0 0;color:var(--muted)}.pairs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .pair{min-height:154px;padding:18px;border:1px solid var(--line);border-radius:13px;background:var(--panel);cursor:pointer;transition:.16s ease;outline:none}
    .pair:hover,.pair:focus-visible,.pair.selected{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
    .pair-top{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}.pair-code{color:var(--blue);font-weight:700}
    .pair-value{font-size:29px;line-height:1.18;margin:17px 0 5px;letter-spacing:-.4px}.pair-caption{color:var(--muted);font-size:12px}
    .pair-reverse{border-top:1px solid var(--line);margin-top:15px;padding-top:12px}.pair-reverse b{color:var(--text);font-weight:400}
    .converter{margin-top:24px;padding:18px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}.converter h2{margin:0 0 14px}
    .converter-row{display:grid;grid-template-columns:minmax(0,1fr) 42px minmax(0,1fr);gap:10px;align-items:center}.field{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
    .field-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}.field label{color:var(--muted);font-size:12px}.field select{padding:2px 22px 2px 0;border:0;background:transparent;color:var(--muted);font-size:12px;text-align:right}
    .field input{width:100%;padding:0;border:0;background:transparent;border-radius:0;font-size:24px;outline:none}.field input:focus{box-shadow:none}.swap{padding:0;background:transparent;border:0;color:var(--blue);font-size:22px;font-weight:400}.swap:hover{filter:none;color:#fff}
    .crypto{margin-top:24px;overflow:hidden;border-radius:13px;background:var(--panel)}.crypto-head,.crypto-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;padding:12px 14px;align-items:center}.crypto-head{color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}.crypto-row{font-size:15px;border-bottom:1px solid var(--line)}.crypto-row:last-child{border-bottom:0}.crypto-row span:not(:first-child),.crypto-head span:not(:first-child){text-align:right}.ticker{color:var(--accent);font-weight:700;margin-left:6px}.source{font-size:12px;margin-top:16px}
    @media(max-width:760px){header{display:block}.controls{margin-top:16px;justify-content:space-between}.pairs{grid-template-columns:1fr 1fr}.converter-row{grid-template-columns:1fr}.swap{transform:rotate(90deg);justify-self:center}.crypto-head,.crypto-row{grid-template-columns:1.5fr 1fr 1fr}}
    @media(max-width:480px){.pairs{grid-template-columns:1fr}.wrap{padding:18px 12px 32px}.pair-value{font-size:26px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div><h1>Курс валют</h1><p class="subtitle">Сравнение валютных пар и криптовалют</p></div>
      <div class="controls"><span class="last-update" id="lastUpdate" aria-live="polite">Последнее обновление: —</span></div>
    </header>
    <p class="status" id="status">Загрузка котировок...</p>
    <h2>Основные валютные пары</h2>
    <section class="pairs" id="pairs" aria-label="Основные валютные пары"></section>
    <section class="converter" aria-label="Конвертер выбранной пары">
      <h2>Конвертер выбранной пары</h2>
      <div class="converter-row">
        <div class="field"><div class="field-head"><label id="fromLabel" for="fromInput">Казахстанский тенге</label><select id="fromSelect" aria-label="Валюта исходной суммы"></select></div><input id="fromInput" type="number" min="0" step="any" value="1" inputmode="decimal"></div>
        <button class="swap" id="swapButton" type="button" aria-label="Поменять валюты местами">↔</button>
        <div class="field"><div class="field-head"><label id="toLabel" for="toInput">Российский рубль</label><select id="toSelect" aria-label="Валюта результата"></select></div><input id="toInput" type="number" min="0" step="any" value="0" inputmode="decimal"></div>
      </div>
    </section>
    <h2>Криптовалюты</h2>
    <section class="crypto" aria-label="Криптовалюты">
      <div class="crypto-head"><span>АКТИВ</span><span>RUB</span><span>USD</span></div>
      <div id="cryptoRows"></div>
    </section>
    <p class="source">Источники: часовой кэш Frankfurter и CoinGecko. Кэш обновляется сервером, криптовалюты — примерно раз в 30 секунд.</p>
  </main>
  <script>
    const currencies={
      RUB:{name:"Российский рубль",short:"RUB"},
      USD:{name:"Доллар США",short:"USD"},
      EUR:{name:"Евро",short:"EUR"},
      KZT:{name:"Казахстанский тенге",short:"KZT"},
      CNY:{name:"Китайский юань",short:"CNY"},
      JPY:{name:"Японская йена",short:"JPY"},
      TRY:{name:"Турецкая лира",short:"TRY"}
    };
    const pairCodes=["USD","EUR","KZT","CNY","JPY","TRY"];
    const cryptoInfo=[
      {id:"bitcoin",name:"Bitcoin",ticker:"BTC"},
      {id:"ethereum",name:"Ethereum",ticker:"ETH"},
      {id:"dogecoin",name:"Dogecoin",ticker:"DOGE"},
      {id:"tether",name:"Tether",ticker:"USDT"},
      {id:"binancecoin",name:"BNB",ticker:"BNB"},
      {id:"ripple",name:"XRP",ticker:"XRP"},
      {id:"solana",name:"Solana",ticker:"SOL"},
      {id:"usd-coin",name:"USD Coin",ticker:"USDC"},
      {id:"cardano",name:"Cardano",ticker:"ADA"},
      {id:"tron",name:"TRON",ticker:"TRX"},
      {id:"the-open-network",name:"Toncoin",ticker:"TON"},
      {id:"chainlink",name:"Chainlink",ticker:"LINK"},
      {id:"avalanche-2",name:"Avalanche",ticker:"AVAX"}
    ];
    const fiatCacheUrl="./data/fiat-rates.json";
    const cryptoUrl="https://api.coingecko.com/api/v3/simple/price?ids="+cryptoInfo.map(item=>item.id).join(",")+"&vs_currencies=rub,usd&include_last_updated_at=true";
    let fiatRates={RUB:1},cryptoRates={},fromCode="KZT",toCode="RUB",fiatTimer=null,cryptoTimer=null,cryptoRetryDelay=0,fiatError="",cryptoError="";
    const pairs=document.getElementById("pairs"),statusEl=document.getElementById("status"),lastUpdateEl=document.getElementById("lastUpdate"),fromInput=document.getElementById("fromInput"),toInput=document.getElementById("toInput"),fromSelect=document.getElementById("fromSelect"),toSelect=document.getElementById("toSelect");
    const format=(value,digits=8)=>Number.isFinite(value)?new Intl.NumberFormat("ru-RU",{maximumFractionDigits:digits}).format(value):"—";
    const rubPerUnit=code=>code==="RUB"?1:(fiatRates.RUB||0)/(fiatRates[code]||0);
    function renderSelects(){
      const options=Object.keys(currencies).map(code=>"<option value=\""+code+"\">"+currencies[code].name+"</option>").join("");
      fromSelect.innerHTML=options;toSelect.innerHTML=options;fromSelect.value=fromCode;toSelect.value=toCode;
    }
    function renderPairs(){
      pairs.innerHTML=pairCodes.map(code=>{
        const rate=rubPerUnit(code),reverse=rate?1/rate:0;
        return '<article class="pair'+(code===fromCode?' selected':'')+'" data-code="'+code+'" tabindex="0" role="button" aria-label="Выбрать '+currencies[code].name+'"><div class="pair-top"><span>'+currencies[code].name+'</span><span class="pair-code">'+code+' / RUB</span></div><div class="pair-value">1 '+code+' = '+format(rate,8)+' RUB</div><div class="pair-caption">стоимость одной единицы</div><div class="pair-reverse"><span>1 RUB = </span><b>'+format(reverse,8)+' '+code+'</b></div></article>';
      }).join("");
      pairs.querySelectorAll(".pair").forEach(card=>{
        const choose=()=>{fromCode=card.dataset.code;toCode="RUB";fromInput.value="1";renderConverter()};
        card.addEventListener("click",choose);card.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();choose()}});
      });
    }
    function renderConverter(){
      fromSelect.value=fromCode;toSelect.value=toCode;
      document.getElementById("fromLabel").textContent=currencies[fromCode].name;
      document.getElementById("toLabel").textContent=currencies[toCode].name;
      const amount=Number(fromInput.value);
      toInput.value=Number.isFinite(amount)?(amount*rubPerUnit(fromCode)/rubPerUnit(toCode)).toFixed(8).replace(/0+$/,"").replace(/\.$/,""):"";
      pairs.querySelectorAll(".pair").forEach(card=>card.classList.toggle("selected",card.dataset.code===fromCode));
    }
    function renderCrypto(){
      document.getElementById("cryptoRows").innerHTML=cryptoInfo.map(item=>{
        const data=cryptoRates[item.id]||{},rub=data.rub,usd=data.usd;
        return '<div class="crypto-row"><span>'+item.name+' <span class="ticker">'+item.ticker+'</span></span><span>'+format(rub,2)+'</span><span>'+format(usd,6)+'</span></div>';
      }).join("");
    }
    function recalculateFromTarget(){
      const amount=Number(toInput.value),rate=rubPerUnit(fromCode)/rubPerUnit(toCode);
      fromInput.value=Number.isFinite(amount)?(amount/rate).toFixed(8).replace(/0+$/,"").replace(/\.$/,""):"";
    }
    async function fetchJson(url,label){
      const response=await fetch(url,{cache:"no-store"});
      if(response.status===429){const error=new Error(label+": превышен лимит запросов");error.code="RATE_LIMIT";error.retryAfter=Number(response.headers.get("Retry-After"))||0;throw error}
      let payload=null;
      try{payload=await response.json()}catch(error){throw new Error(label+": некорректный ответ сервиса")}
      if(!response.ok)throw new Error(label+": HTTP "+response.status);
      return payload;
    }
    function describeError(error){return error&&error.code==="RATE_LIMIT"?"временно превышен лимит запросов":"сервис временно недоступен"}
    function renderStatus(){
      const errors=[fiatError,cryptoError].filter(Boolean);
      statusEl.textContent=errors.length?(fiatRates.RUB||cryptoRates.bitcoin?"Часть котировок: ":"Котировки временно недоступны: ")+errors.join("; "):"Котировки обновлены";
    }
    function scheduleFiatCache(delay=10000){if(fiatTimer)clearTimeout(fiatTimer);fiatTimer=setTimeout(loadFiatCache,delay)}
    function scheduleCrypto(delay=30000){if(cryptoTimer)clearTimeout(cryptoTimer);cryptoTimer=setTimeout(loadCryptoRates,delay)}
    async function loadFiatCache(){
      fiatError="";
      try{
        const payload=await fetchJson(fiatCacheUrl,"Кэш Frankfurter");
        if(!payload||!payload.rates||typeof payload.rates.RUB!=="number")throw new Error("Кэш Frankfurter: некорректный формат");
        fiatRates=Object.assign({USD:1},payload.rates);renderPairs();renderConverter();
        if(payload.updatedAt)lastUpdateEl.textContent="Последнее обновление: "+new Date(payload.updatedAt).toLocaleString("ru-RU");
      }catch(error){fiatError=describeError(error);console.error(error)}
      renderStatus();scheduleFiatCache(10000);
    }
    async function loadCryptoRates(){
      cryptoError="";
      try{cryptoRates=await fetchJson(cryptoUrl,"CoinGecko");renderCrypto();lastUpdateEl.textContent="Последнее обновление: "+new Date().toLocaleString("ru-RU");cryptoRetryDelay=0}
      catch(error){cryptoError=describeError(error);console.error(error);cryptoRetryDelay=error.code==="RATE_LIMIT"?(cryptoRetryDelay?Math.min(cryptoRetryDelay*2,20*60*1000):60*1000):0}
      renderStatus();scheduleCrypto(cryptoRetryDelay||30000);
    }
    fromInput.addEventListener("input",renderConverter);toInput.addEventListener("input",recalculateFromTarget);
    fromSelect.addEventListener("change",()=>{fromCode=fromSelect.value;renderConverter()});toSelect.addEventListener("change",()=>{toCode=toSelect.value;renderConverter()});
    document.getElementById("swapButton").addEventListener("click",()=>{const oldFrom=fromCode;fromCode=toCode;toCode=oldFrom;fromInput.value="1";renderConverter()});
    renderSelects();renderPairs();renderConverter();renderCrypto();loadFiatCache();loadCryptoRates();
  </script>
</body>
</html>
