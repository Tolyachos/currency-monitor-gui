<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Монитор курсов</title>
  <style>
    :root{color-scheme:dark;--bg:#18191c;--panel:#202124;--line:#38393e;--text:#f1f3f4;--muted:#9aa0a6;--blue:#9ab7e8;--green:#77d2a8;--red:#ff6375}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{width:min(1060px,calc(100% - 32px));margin:auto;padding:34px 0 45px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:25px}h1{font-size:30px;margin:0 0 8px;font-weight:500}.sub{margin:0;color:var(--muted)}
    .actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}select,button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:#25262a;color:var(--text)}button{background:var(--blue);border:0;color:#10151d;font-weight:bold;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
    .status{min-height:21px;margin:0 0 17px;color:var(--muted);font-size:14px}.status.error{color:var(--red)}.section-title{font-size:19px;font-weight:500;margin:0 0 13px}.pairs{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.pair{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px 18px 15px;min-height:172px}.pair-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.pair-code{color:var(--blue);font-size:14px;font-weight:bold}.pair-value{font-size:30px;color:var(--text);margin:20px 0 7px;letter-spacing:-.5px}.pair-caption{color:var(--muted);font-size:13px}.inverse{margin-top:17px;padding-top:11px;border-top:1px solid #33353a;color:var(--muted);font-size:12px}.inverse strong{color:var(--text);font-size:14px;font-weight:500;margin-left:4px}
    .converter{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px;margin-top:24px}.converter h2{margin:0 0 15px;font-size:18px;font-weight:500}.fields{display:grid;grid-template-columns:1fr 38px 1fr;gap:11px;align-items:center}.field{background:#18191c;border:1px solid var(--line);border-radius:10px;padding:12px 14px}.field small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input{display:block;width:100%;border:0;outline:0;background:transparent;color:var(--text);font:500 22px Arial,Segoe UI,sans-serif;padding:0}.field input:focus{color:var(--blue)}.swap{border:0;padding:0;background:transparent;color:var(--muted);text-align:center;font-size:22px;line-height:1;box-shadow:none}.swap:hover,.swap:focus{background:transparent;color:var(--blue);outline:0}.crypto{margin-top:26px}.crypto table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}.crypto th,.crypto td{padding:14px 17px;border-bottom:1px solid var(--line);text-align:right}.crypto th:first-child,.crypto td:first-child{text-align:left}.crypto th{color:var(--muted);font-size:12px;font-weight:normal;text-transform:uppercase}.crypto tr:last-child td{border-bottom:0}.crypto td{font-variant-numeric:tabular-nums}.coin{color:var(--green);font-weight:bold;margin-left:8px}.foot{color:var(--muted);font-size:12px;line-height:1.6;margin-top:17px}
    @media(max-width:780px){.top{display:block}.actions{justify-content:flex-start;margin-top:18px}.pairs{grid-template-columns:1fr}.wrap{width:calc(100% - 20px);padding-top:22px}.fields{grid-template-columns:1fr}.swap{transform:rotate(90deg)}.pair{min-height:150px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><div><h1>Курс валют</h1><p class="sub">Сравнение валютных пар и криптовалют</p></div><div class="actions"><span>Обновлять:</span><select id="interval"><option value="30">30 секунд</option><option value="60" selected>1 минута</option><option value="300">5 минут</option></select><button id="refresh">Обновить</button></div></header>
    <p id="status" class="status">Загрузка котировок…</p><span id="toAmount" hidden></span>
    <h2 class="section-title">Основные валютные пары</h2><section id="pairs" class="pairs"></section>
    <section class="converter"><h2>Конвертер выбранной пары</h2><div class="fields"><div class="field"><small id="fromName">Казахстанский тенге</small><input id="fromInput" type="number" min="0" step="any" value="1" aria-label="Сумма в тенге"></div><button class="swap" id="swapButton" type="button" aria-label="Поменять валюты местами">↔</button><div class="field"><small id="toName">Российский рубль</small><input id="toInput" type="number" min="0" step="any" value="0" aria-label="Сумма в рублях"></div></div></section>
    <section class="crypto"><h2 class="section-title">Криптовалюты</h2><table><thead><tr><th>Актив</th><th>RUB</th><th>USD</th></tr></thead><tbody id="cryptoRows"></tbody></table></section><p class="foot">Источники: Open Exchange Rates и CoinGecko. Данные обновляются напрямую из браузера.</p>
  </main>
  <script>
    const fiatUrl='https://open.er-api.com/v6/latest/USD',cryptoUrl='https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,dogecoin&vs_currencies=rub,usd';const $=id=>document.getElementById(id);let timer;const fmt=v=>v==null||Number.isNaN(v)?'—':new Intl.NumberFormat('ru-RU',{maximumFractionDigits:Math.abs(v)>=1?4:8}).format(v);const pair=(code,name,rub)=>`<article class="pair"><div class="pair-head"><span>${name}</span><span class="pair-code">${code} / RUB</span></div><div class="pair-value">1 ${code} = ${fmt(rub)} RUB</div><div class="pair-caption">стоимость одной единицы</div><div class="inverse">1 RUB = <strong>${fmt(1/rub)} ${code}</strong></div></article>`;
    async function loadRates(){$('refresh').disabled=true;$('status').className='status';$('status').textContent='Обновление котировок…';try{const[a,b]=await Promise.all([fetch(fiatUrl),fetch(cryptoUrl)]);if(!a.ok||!b.ok)throw Error('Сервис временно недоступен');const f=await a.json(),c=await b.json();if(f.result!=='success')throw Error('Не удалось получить курсы валют');const usdRub=Number(f.rates.RUB),eurRub=usdRub/Number(f.rates.EUR),kztRub=usdRub/Number(f.rates.KZT);$('pairs').innerHTML=[pair('USD','Доллар США',usdRub),pair('EUR','Евро',eurRub),pair('KZT','Казахстанский тенге',kztRub)].join('');$('toAmount').textContent=`${fmt(kztRub)} RUB`;$('cryptoRows').innerHTML=[['Bitcoin','BTC',c.bitcoin],['Ethereum','ETH',c.ethereum],['Dogecoin','DOGE',c.dogecoin]].map(x=>`<tr><td>${x[0]}<span class="coin">${x[1]}</span></td><td>${fmt(x[2].rub)}</td><td>${fmt(x[2].usd)}</td></tr>`).join('');$('status').textContent=`Обновлено: ${new Date().toLocaleString('ru-RU')}`}catch(e){$('status').className='status error';$('status').textContent=`Ошибка обновления: ${e.message}. Нажмите «Обновить», чтобы повторить.`}finally{$('refresh').disabled=false}}
    function restart(){clearInterval(timer);timer=setInterval(loadRates,Number($('interval').value)*1000)}$('refresh').addEventListener('click',loadRates);$('interval').addEventListener('change',restart);loadRates();restart();
  </script>
<script>
  /* Интерактивный конвертер: поля редактируются, стрелка меняет пару местами. */
  clearInterval(timer);
  const converterCurrencies={RUB:'Российский рубль',KZT:'Казахстанский тенге',USD:'Доллар США',EUR:'Евро'};
  let converterRates={RUB:1,KZT:1},converterFrom='KZT',converterTo='RUB',converterFromValue=1,converterToValue=0;
  const fromBox=document.querySelector('.fields .field:first-child'),toBox=document.querySelector('.fields .field:last-child'),swapBox=document.querySelector('#swapButton');
  swapBox.setAttribute('role','button');swapBox.setAttribute('tabindex','0');swapBox.setAttribute('aria-label','Поменять валюты местами');swapBox.style.cursor='pointer';
  function inputNumber(value){return Number.isFinite(value)?String(Number(value.toFixed(8))):''}
  function renderConverter(){
    $('fromName').textContent=converterCurrencies[converterFrom];$('toName').textContent=converterCurrencies[converterTo];
    fromBox.innerHTML=`<small id="fromName">${converterCurrencies[converterFrom]}</small><input id="fromInput" type="number" min="0" step="any" value="${inputNumber(converterFromValue)}" aria-label="Сумма ${converterCurrencies[converterFrom]}">`;
    toBox.innerHTML=`<small id="toName">${converterCurrencies[converterTo]}</small><input id="toInput" type="number" min="0" step="any" value="${inputNumber(converterToValue)}" aria-label="Сумма ${converterCurrencies[converterTo]}">`;
    $('fromInput').addEventListener('input',()=>{converterFromValue=Number($('fromInput').value)||0;converterToValue=converterFromValue*converterRates[converterFrom]/converterRates[converterTo];$('toInput').value=inputNumber(converterToValue)});
    $('toInput').addEventListener('input',()=>{converterToValue=Number($('toInput').value)||0;converterFromValue=converterToValue*converterRates[converterTo]/converterRates[converterFrom];$('fromInput').value=inputNumber(converterFromValue)});
  }
  function swapCurrencies(){const oldFrom=converterFromValue,oldTo=converterToValue;[converterFrom,converterTo]=[converterTo,converterFrom];converterFromValue=oldTo;converterToValue=oldFrom;renderConverter()}
  swapBox.addEventListener('click',swapCurrencies);swapBox.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();swapCurrencies()}});
  const refreshButton=$('refresh').cloneNode(true);$('refresh').replaceWith(refreshButton);refreshButton.addEventListener('click',()=>{loadRates();loadConverterRates()});
  const intervalSelect=$('interval').cloneNode(true);$('interval').replaceWith(intervalSelect);
  async function loadConverterRates(){try{const response=await fetch(fiatUrl);const data=await response.json();if(data.result!=='success')throw Error('Сервис валют временно недоступен');const usdRub=Number(data.rates.RUB);converterRates={RUB:1,KZT:usdRub/Number(data.rates.KZT),USD:usdRub,EUR:usdRub/Number(data.rates.EUR)};converterToValue=converterFromValue*converterRates[converterFrom]/converterRates[converterTo];renderConverter()}catch(error){console.warn('Конвертер:',error.message)}}
  renderConverter();loadConverterRates();let converterTimer=setInterval(()=>{loadRates();loadConverterRates()},Number(intervalSelect.value)*1000);intervalSelect.addEventListener('change',()=>{clearInterval(converterTimer);converterTimer=setInterval(()=>{loadRates();loadConverterRates()},Number(intervalSelect.value)*1000)});
</script>
</body>
</html>
