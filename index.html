<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Монитор курсов</title><style>
:root{color-scheme:dark;--bg:#18191c;--panel:#202124;--line:#38393e;--text:#f1f3f4;--muted:#9aa0a6;--blue:#9ab7e8;--green:#77d2a8;--red:#ff6375}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}.wrap{width:min(1060px,calc(100% - 32px));margin:auto;padding:34px 0 45px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:25px}h1{font-size:30px;margin:0 0 8px;font-weight:500}.sub,.status,.hint,.caption,.foot{color:var(--muted)}.sub{margin:0}.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}select,button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:#25262a;color:var(--text)}button{background:var(--blue);border:0;color:#10151d;font-weight:bold;cursor:pointer}.status{min-height:21px;margin:0 0 17px;font-size:14px}.status.error{color:var(--red)}.title{font-size:19px;font-weight:500;margin:0 0 13px}.pairs{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.pair,.converter,.field,table{background:var(--panel);border:1px solid var(--line);border-radius:13px}.pair{padding:18px;min-height:172px}.pairHead{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.code{color:var(--blue);font-weight:bold}.value{font-size:28px;margin:20px 0 7px}.inverse{margin-top:17px;padding-top:11px;border-top:1px solid #33353a;color:var(--muted);font-size:12px}.inverse b{color:var(--text);font-size:14px;font-weight:500;margin-left:4px}.converter{padding:18px;margin-top:24px}.converter h2{margin:0 0 15px;font-size:18px;font-weight:500}.fields{display:grid;grid-template-columns:1fr 38px 1fr;gap:11px;align-items:center}.field{background:#18191c;padding:12px 14px}.field small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input{display:block;width:100%;border:0;outline:0;background:transparent;color:var(--text);font:500 22px Arial;padding:0}.field input:focus{color:var(--blue)}.swap{border:0;padding:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;box-shadow:none}.swap:hover,.swap:focus{background:transparent;color:var(--blue);outline:0}.crypto{margin-top:26px}.crypto table{width:100%;border-collapse:collapse;overflow:hidden}.crypto th,.crypto td{padding:14px 17px;border-bottom:1px solid var(--line);text-align:right}.crypto th:first-child,.crypto td:first-child{text-align:left}.crypto th{color:var(--muted);font-size:12px;font-weight:normal;text-transform:uppercase}.crypto tr:last-child td{border-bottom:0}.crypto td{font-variant-numeric:tabular-nums}.coin{color:var(--green);font-weight:bold;margin-left:8px}.foot{font-size:12px;line-height:1.6;margin-top:17px}@media(max-width:780px){.top{display:block}.actions{justify-content:flex-start;margin-top:18px}.pairs{grid-template-columns:1fr}.wrap{width:calc(100% - 20px);padding-top:22px}.fields{grid-template-columns:1fr}.swap{transform:rotate(90deg)}}
+</style></head><body><main class="wrap"><header class="top"><div><h1>Курс валют</h1><p class="sub">Сравнение валютных пар и криптовалют</p></div><div class="actions"><span>Обновлять:</span><select id="interval"><option value="30">30 секунд</option><option value="60" selected>1 минута</option><option value="300">5 минут</option></select><button id="refresh">Обновить</button></div></header><p id="status" class="status">Загрузка котировок...</p><h2 class="title">Основные валютные пары</h2><section id="pairs" class="pairs"></section><section class="converter"><h2>Конвертер выбранной пары</h2><div class="fields"><div class="field"><small id="fromName">Казахстанский тенге</small><input id="fromInput" type="number" min="0" step="any" value="1"></div><button class="swap" id="swapButton" type="button" aria-label="Поменять валюты местами">↔</button><div class="field"><small id="toName">Российский рубль</small><input id="toInput" type="number" min="0" step="any" value="0"></div></div></section><section class="crypto"><h2 class="title">Криптовалюты</h2><table><thead><tr><th>Актив</th><th>RUB</th><th>USD</th></tr></thead><tbody id="cryptoRows"></tbody></table></section><p class="foot">Источники: Open Exchange Rates и CoinGecko. Данные обновляются напрямую из браузера.</p></main><script>
+const fiatUrl='https://open.er-api.com/v6/latest/USD',cryptoUrl='https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,dogecoin&vs_currencies=rub,usd';const byId=function(id){return document.getElementById(id)},fmt=function(v){return v==null||isNaN(v)?'—':new Intl.NumberFormat('ru-RU',{maximumFractionDigits=Math.abs(v)>=1?4:8}).format(v)};let rates={RUB:1,KZT:1,USD:1,EUR:1},from='KZT',to='RUB',timer;
+function pair(code,name,rate){return '<article class="pair"><div class="pairHead"><span>'+name+'</span><span class="code">'+code+' / RUB</span></div><div class="value">1 '+code+' = '+fmt(rate)+' RUB</div><div class="caption">стоимость одной единицы</div><div class="inverse">1 RUB = <b>'+fmt(1/rate)+' '+code+'</b></div></article>'}
+function convertFrom(){var a=Number(byId('fromInput').value)||0;byId('toInput').value=(a*rates[from]/rates[to]).toFixed(8).replace(/0+$/,'').replace(/\\.$/,'')}
+function convertTo(){var a=Number(byId('toInput').value)||0;byId('fromInput').value=(a*rates[to]/rates[from]).toFixed(8).replace(/0+$/,'').replace(/\\.$/,'')}
+function bind(){byId('fromInput').oninput=convertFrom;byId('toInput').oninput=convertTo;byId('fromName').textContent={KZT:'Казахстанский тенге',RUB:'Российский рубль',USD:'Доллар США',EUR:'Евро'}[from];byId('toName').textContent={KZT:'Казахстанский тенге',RUB:'Российский рубль',USD:'Доллар США',EUR:'Евро'}[to]}
+function swap(){var a=byId('fromInput').value,b=byId('toInput').value;var x=from;from=to;to=x;byId('fromInput').value=b;byId('toInput').value=a;bind()}
+async function load(){try{var res=await Promise.all([fetch(fiatUrl),fetch(cryptoUrl)]);var f=await res[0].json(),c=await res[1].json();if(f.result!=='success')throw Error('Сервис валют недоступен');var usdRub=Number(f.rates.RUB);rates={RUB:1,KZT:usdRub/Number(f.rates.KZT),USD:usdRub,EUR:usdRub/Number(f.rates.EUR)};byId('pairs').innerHTML=pair('USD','Доллар США',rates.USD)+pair('EUR','Евро',rates.EUR)+pair('KZT','Казахстанский тенге',rates.KZT);bind();convertFrom();byId('cryptoRows').innerHTML=[['Bitcoin','BTC',c.bitcoin],['Ethereum','ETH',c.ethereum],['Dogecoin','DOGE',c.dogecoin]].map(function(x){return '<tr><td>'+x[0]+'<span class="coin">'+x[1]+'</span></td><td>'+fmt(x[2].rub)+'</td><td>'+fmt(x[2].usd)+'</td></tr>'}).join('');byId('status').textContent='Обновлено: '+new Date().toLocaleString('ru-RU')}catch(e){byId('status').className='status error';byId('status').textContent='Ошибка обновления: '+e.message}}
+byId('swapButton').onclick=swap;byId('refresh').onclick=load;byId('interval').onchange=function(){clearInterval(timer);timer=setInterval(load,Number(this.value)*1000)};load();timer=setInterval(load,60000);
+</script></body></html>
